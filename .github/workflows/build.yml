name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Repo płaskie (bez folderów)? Odtwórz strukturę. Zwykłe repo? Buduj od razu.
      - name: Restore folders
        run: |
          if [ -f build.gradle ] && [ -d src ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            python restore.py
            echo "PROJECT_DIR=intelligent-mod" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle build --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # Zawsze (też przy błędzie): wypisz błędy kompilacji w podsumowaniu biegu
      - name: Error summary
        if: failure()
        run: |
          {
            echo "## Błędy kompilacji"
            echo '```'
            grep -B1 -A4 -E "error:|What went wrong" build.log | head -150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: intelligent-mod
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar

      - name: Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/build/libs/*.jar
