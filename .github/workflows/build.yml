name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Jeśli repo ma płaskie pliki (bez folderów), odtwórz strukturę
      - name: Restore folders
        run: |
          if [ -f build.gradle ] && [ -d src ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            python restore.py
            echo "PROJECT_DIR=intelligent-mod" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: intelligent-mod
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar

      # Po wrzuceniu taga np. v1.1.0 jar trafia do zakładki Releases
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/build/libs/*.jar
